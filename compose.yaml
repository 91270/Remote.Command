name: remote-command

services:
  gateway:
    image: ghcr.io/91270/remote.command:0.5.1
    init: true
    restart: unless-stopped
    stop_grace_period: 25s
    environment:
      PUBLIC_ORIGIN: https://mcp.example.com
      OAUTH_CLIENT_ID: remote_command
      OAUTH_REDIRECT_URIS: https://chatgpt.com/connector_platform_oauth_redirect
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
