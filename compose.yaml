name: remote-command

services:
  gateway:
    image: ghcr.io/91270/remote.command:0.5.1
    init: true
    restart: unless-stopped
    stop_grace_period: 25s
    environment:
      PUBLIC_ORIGIN: https://mcp.example.com
      # OAuth 客户端与回调地址已通过 DCR (/oauth/register) 自动发现并注册，无需手动配置
      # 如需限制额外回调域名，可按需配置 OAUTH_ALLOWED_REDIRECT_HOSTS: chatgpt.com,platform.openai.com
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
