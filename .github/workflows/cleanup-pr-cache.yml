name: Cleanup caches when a pull request closes

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: Delete cache entries for the closed PR
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete PR merge-ref and source-branch caches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          refs=("refs/pull/$PR_NUMBER/merge")
          if [[ -n "$HEAD_REF" && "$HEAD_REF" != "$DEFAULT_BRANCH" ]]; then
            refs+=("refs/heads/$HEAD_REF")
          fi
          for ref in "${refs[@]}"; do
            cache_ids="$(gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/caches" \
              -f "ref=$ref" -F per_page=100 --jq '.actions_caches[].id')"
            while IFS= read -r cache_id; do
              [[ -n "$cache_id" ]] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id" >/dev/null
              echo "Deleted cache $cache_id for $ref"
            done <<< "$cache_ids"
          done
