name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned Gateway image and release files
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep procps
      - if: runner.os == 'macOS'
        run: brew install ripgrep
      - if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - run: npm ci --ignore-scripts
      - name: Test complete Agent and Gateway
        run: npm test
        env:
          PRM_TEST_FULL: '1'
          PRM_TEST_LAUNCH: '1'
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install host Nginx
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Verify the deployment image, bind mount and host Nginx HTTPS proxy
        run: |
          export RCM_GATEWAY_IMAGE=remote-command:compose-test
          export RCM_DATA_DIR="$RUNNER_TEMP/rcm-data"
          docker build -t "$RCM_GATEWAY_IMAGE" .
          npm run setup -- mcp.invalid.example
          nginx_dir=$(mktemp -d "$RUNNER_TEMP/rcm-nginx.XXXXXX")
          trap 'docker compose down' EXIT
          docker compose config -q
          test "$(docker compose config --services | sort)" = "$(printf 'gateway\ngateway-data-init')"
          test ! -e "$RCM_DATA_DIR"
          docker compose up -d --pull never --wait --wait-timeout 40
          test "$(docker compose port gateway 8787)" = 127.0.0.1:8787
          test "$(sudo stat -c '%u:%g %a' "$RCM_DATA_DIR")" = '1000:1000 700'
          sudo test -f "$RCM_DATA_DIR/gateway.sqlite"

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=mcp.invalid.example \
            -addext subjectAltName=DNS:mcp.invalid.example -keyout "$nginx_dir/key.pem" -out "$nginx_dir/cert.pem"
          sed -e 's/listen 443 ssl;/listen 127.0.0.1:18443 ssl;/' \
            -e "s|/etc/letsencrypt/live/mcp.example.com/fullchain.pem|$nginx_dir/cert.pem|" \
            -e "s|/etc/letsencrypt/live/mcp.example.com/privkey.pem|$nginx_dir/key.pem|" \
            -e 's/mcp\.example\.com/mcp.invalid.example/' \
            deploy/nginx/remote-command.conf > "$nginx_dir/site.conf"
          cat > "$nginx_dir/nginx.conf" <<EOF
          user www-data;
          pid $nginx_dir/nginx.pid;
          error_log stderr;
          events {}
          http { include $nginx_dir/site.conf; }
          EOF
          sudo nginx -t -c "$nginx_dir/nginx.conf"
          sudo nginx -c "$nginx_dir/nginx.conf"
          trap 'sudo nginx -s quit -c "$nginx_dir/nginx.conf"; docker compose down' EXIT

          origin=https://mcp.invalid.example
          request() {
            curl --silent --show-error --noproxy '*' --cacert "$nginx_dir/cert.pem" \
              --connect-to mcp.invalid.example:443:127.0.0.1:18443 "$@"
          }
          request --fail "$origin/readyz"
          request --fail "$origin/manage" -o /dev/null
          request --fail "$origin/.well-known/oauth-protected-resource/mcp" \
            | jq -e --arg resource "$origin/mcp" '.resource == $resource'
          node -e "process.stdout.write(' '.repeat(2 * 1024 * 1024))" > "$nginx_dir/sync-body"
          test "$(request -o /dev/null -w '%{http_code}' --data-binary "@$nginx_dir/sync-body" "$origin/device/sync")" = 401

          npm run backup -- "$RUNNER_TEMP/rcm.sqlite"
          docker compose exec -T gateway node dist/admin.js verify-backup < "$RUNNER_TEMP/rcm.sqlite"
          docker compose run --rm --no-deps -T -e STATE_DB=/data/restored.sqlite gateway node dist/admin.js restore < "$RUNNER_TEMP/rcm.sqlite"
          docker compose down
          docker compose up -d --pull never --wait --wait-timeout 40
          sudo test -f "$RCM_DATA_DIR/restored.sqlite"
          request --fail "$origin/readyz"
  package:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package:release -- --with-image
      - uses: actions/upload-artifact@v4
        with:
          name: remote-command-release
          path: releases/remote-command-*
          if-no-files-found: error
          retention-days: 1
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: package
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: remote-command-release
          path: releases
      - name: Publish the Gateway image and release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          stem="remote-command-$version"
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository:$version"
          cd releases
          sha256sum -c "$stem-SHA256SUMS"
          files=("$stem.tgz" "$stem-compose.yaml" "$stem-deploy.tar.gz" "$stem-gateway-linux-amd64.tar.gz" "$stem-SHA256SUMS")

          if release=$(gh release view "$tag" --json isDraft,targetCommitish --repo "$GITHUB_REPOSITORY"); then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' <<< "$release" >/dev/null
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" --draft --target "$GITHUB_SHA" \
              --title "Remote.Command $version" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker image load -i "$stem-gateway-linux-amd64.tar.gz"
          docker tag "remote-command:$version" "$image"
          docker push "$image"
          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
