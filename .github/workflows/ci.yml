name: "CI & Release / 自动化测试与发布"
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      publish:
        description: 发布带版本号的 Gateway 镜像和 Release 文件
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: read
jobs:
  test:
    name: Linux 全量自动化测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4
      - name: 配置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 按需安装 Linux 测试依赖
        run: |
          pkgs=""
          command -v rg >/dev/null || pkgs="$pkgs ripgrep"
          command -v ps >/dev/null || pkgs="$pkgs procps"
          if [ -n "$pkgs" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $pkgs
          fi
      - name: 安装 Node.js 依赖
        run: npm ci --ignore-scripts
      - name: 运行 Agent 与 Gateway 全量测试
        env:
          RCM_TEST_LAUNCH: '1'
        run: |
          npm run build
          fast_tests=()
          for f in test/*.test.mjs; do
            case "$f" in
              test/e2e.test.mjs|test/dc-core.test.mjs) ;;
              *) fast_tests+=("$f") ;;
            esac
          done
          node --test "${fast_tests[@]}"
          node --test --test-concurrency=1 test/dc-core.test.mjs test/e2e.test.mjs
  test-cross-platform:
    name: 跨平台 Agent 兼容测试
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4
      - name: 配置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 按需安装 macOS 测试依赖
        if: runner.os == 'macOS'
        run: command -v rg >/dev/null || brew install ripgrep
      - name: 按需安装 Windows 测试依赖
        if: runner.os == 'Windows'
        run: if (-not (Get-Command rg.exe -ErrorAction SilentlyContinue)) { choco install ripgrep -y --no-progress }
      - name: 安装 Node.js 依赖
        run: npm ci --ignore-scripts
      - name: 预热 Windows PowerShell 运行环境
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -Command "1" | Out-Null
      - name: 运行跨平台 Agent 与核心兼容测试
        shell: bash
        env:
          RCM_TEST_LAUNCH: '1'
        run: |
          npm run build
          node --test test/device-flow.test.mjs test/service.test.mjs
          node --test --test-concurrency=1 test/dc-core.test.mjs test/e2e.test.mjs
  compose:
    name: Docker Compose 部署与 HTTPS 代理验证
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出部署源码
        uses: actions/checkout@v4
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 解析 Gateway 镜像名称
        id: meta
        run: echo "image=$(awk '$1 == "image:" {print $2}' compose.yaml)" >> "$GITHUB_OUTPUT"
      - name: 构建 Gateway 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: 安装宿主机轻量 Nginx
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx-light
      - name: 验证部署镜像、数据持久化和 Nginx HTTPS 反向代理
        run: |
          sudo install -d -m 0700 -o 1000 -g 1000 data
          nginx_dir=$(mktemp -d "$RUNNER_TEMP/rcm-nginx.XXXXXX")
          trap 'docker compose down' EXIT
          export PUBLIC_ORIGIN=https://mcp.example.com
          export GOOGLE_CLIENT_ID=ci-google-client-id.apps.googleusercontent.com
          export GOOGLE_CLIENT_SECRET=ci-google-client-secret
          export TRUST_PROXY=1
          docker compose config -q
          test "$(docker compose config --services)" = gateway
          docker compose up -d --pull never --wait --wait-timeout 40
          docker compose port gateway 8787 | grep -qx '0\.0\.0\.0:8787'
          test "$(docker compose exec -T gateway id -u)" = 1000
          sudo test -f data/gateway.sqlite
          test "$(sudo stat -c '%a' data/.owner_key)" = 600
          credentials_before=$(sudo sha256sum data/.owner_key)

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=mcp.example.com \
            -addext subjectAltName=DNS:mcp.example.com -keyout "$nginx_dir/key.pem" -out "$nginx_dir/cert.pem"
          sed -e 's/listen 443 ssl;/listen 127.0.0.1:18443 ssl;/' \
            -e "s|/etc/letsencrypt/live/mcp.example.com/fullchain.pem|$nginx_dir/cert.pem|" \
            -e "s|/etc/letsencrypt/live/mcp.example.com/privkey.pem|$nginx_dir/key.pem|" \
            deploy/nginx/remote-command.conf > "$nginx_dir/site.conf"
          cat > "$nginx_dir/nginx.conf" <<EOF
          user www-data;
          pid $nginx_dir/nginx.pid;
          error_log stderr;
          events {}
          http { include $nginx_dir/site.conf; }
          EOF
          sudo nginx -t -c "$nginx_dir/nginx.conf"
          sudo nginx -c "$nginx_dir/nginx.conf"
          trap 'sudo nginx -s quit -c "$nginx_dir/nginx.conf"; docker compose down' EXIT

          origin=https://mcp.example.com
          request() {
            curl --silent --show-error --noproxy '*' --cacert "$nginx_dir/cert.pem" \
              --connect-to mcp.example.com:443:127.0.0.1:18443 "$@"
          }
          request --fail "$origin/readyz"
          request --fail "$origin/" | grep -q 'Remote.Command'
          request --fail "$origin/manage" -o /dev/null
          docker compose logs gateway | grep -q 'Gateway awaiting first admin sign-in via Google OAuth'
          sudo sh -c 'ls -1 data/logs | grep -Eq "^[0-9]{8}-[0-9]{4}\.log$"'
          request --fail "$origin/manage/api/auth-config" \
            | jq -e '.googleEnabled == true and .hasPasswordAdmin == false and .registrationMode == "invite_only" and .initialized == false'
          test "$(request -o /dev/null -w '%{http_code}' "$origin/manage/api/overview")" = 401
          request --fail "$origin/.well-known/oauth-protected-resource/mcp" \
            | jq -e --arg resource "$origin/mcp" '.resource == $resource'
          request --fail "$origin/.well-known/oauth-authorization-server" \
            | jq -e --arg reg "$origin/oauth/register" '.registration_endpoint == $reg'
          node -e "process.stdout.write(' '.repeat(2 * 1024 * 1024))" > "$nginx_dir/sync-body"
          test "$(request -o /dev/null -w '%{http_code}' --data-binary "@$nginx_dir/sync-body" "$origin/device/sync")" = 401

          node scripts/backup.mjs "$RUNNER_TEMP/rcm.sqlite"
          docker compose exec -T gateway node dist/admin.js verify-backup < "$RUNNER_TEMP/rcm.sqlite"
          docker compose run --rm --no-deps -T -e STATE_DB=/data/restored.sqlite gateway node dist/admin.js restore < "$RUNNER_TEMP/rcm.sqlite"
          docker compose down
          docker compose up -d --pull never --wait --wait-timeout 40
          sudo test -f data/restored.sqlite
          test "$credentials_before" = "$(sudo sha256sum data/.owner_key)"
          request --fail "$origin/readyz"
  package:
    name: 生成发布安装包
    if: github.event_name == 'workflow_dispatch'
    needs: [test, test-cross-platform, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - name: 检出发布源码
        uses: actions/checkout@v4
      - name: 配置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 安装发布所需的 Node.js 依赖
        run: npm ci --ignore-scripts
      - name: 生成包含 Gateway 镜像的发布包
        id: pkg
        run: |
          npm run package:release -- --with-image
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: 上传临时发布产物
        uses: actions/upload-artifact@v4
        with:
          name: remote-command-release
          path: |
            releases/remote-command-*
            !releases/*.map
            !releases/*.log
            !releases/**/*.map
            !releases/**/*.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
  publish:
    name: 发布 Gateway 镜像与 Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref_name == github.event.repository.default_branch
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: publish-release
    permissions:
      contents: write
      packages: write
    steps:
      - name: 下载已校验的发布产物
        uses: actions/download-artifact@v4
        with:
          name: remote-command-release
          path: releases
      - name: 发布 Gateway 镜像并上传 Release 文件
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          version="$RELEASE_VERSION"
          [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]]
          tag="v$version"
          stem="remote-command-$version"
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository:$version"
          cd releases
          sha256sum -c "$stem-SHA256SUMS"
          files=("$stem.tgz" "$stem-compose.yaml" "$stem-deploy.tar.gz" "$stem-gateway-linux-amd64.tar.gz" "$stem-SHA256SUMS")

          if release=$(gh release view "$tag" --json isDraft,targetCommitish --repo "$GITHUB_REPOSITORY"); then
            jq -e --arg commit "$GITHUB_SHA" '.isDraft and .targetCommitish == $commit' <<< "$release" >/dev/null
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" --draft --target "$GITHUB_SHA" \
              --title "Remote.Command $version" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          docker image load -i "$stem-gateway-linux-amd64.tar.gz"
          docker tag "remote-command:$version" "$image"
          docker push "$image"
          gh release edit "$tag" --draft=false --repo "$GITHUB_REPOSITORY"
